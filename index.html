.how{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}

.behind b{color:var(--ink)}
.kpi{padding:14px 16px}

.kpi .s{font-size:13px;color:var(--ink2);margin-top:2px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--pane);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:6px 10px;font-size:13px;display:none;z-index:5;white-space:nowrap}
.bars .r{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.bars .track{display:block;height:16px;background:var(--flow2);border-radius:0 4px 4px 0;position:relative}
.bars .fill{display:block;position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details summary{cursor:pointer;color:var(--ink2);font-size:13.5px;margin-top:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:auto;margin-top:4px}
.empty{padding:36px 12px;text-align:center;color:var(--ink2)}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
